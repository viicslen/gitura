# Project configuration for the Wails CLI.
# After changing `info`, run `wails3 task common:update:build-assets` to regenerate the platform files
# (Info.plist, info.json, nfpm.yaml, ...); that overwrites manual edits to them.
version: '3'

info:
  companyName: "viicslen"
  productName: "gitura"
  productIdentifier: "io.github.viicslen.gitura"
  description: "Review GitHub pull requests"
  copyright: "© viicslen"
  comments: "GitHub PR review desktop application"
  version: "0.14.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
