name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            task: build
            binary: gitura
            asset_name: gitura-linux-amd64

          - os: macos
            runner: macos-latest
            task: darwin:build:universal
            binary: gitura
            asset_name: gitura-macos-universal

          - os: windows
            runner: windows-latest
            task: build
            binary: gitura.exe
            asset_name: gitura-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # Installs the wails3 CLI at the version pinned in go.mod.
      - name: Install Wails
        run: go install tool
        env:
          CGO_ENABLED: 1

      - name: Build
        run: wails3 task ${{ matrix.task }}
        env:
          CGO_ENABLED: 1
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}

      - name: Rename binary
        run: mv "bin/${{ matrix.binary }}" "bin/${{ matrix.asset_name }}"
        shell: bash

      - name: Generate checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "bin/${{ matrix.asset_name }}" > "bin/${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "bin/${{ matrix.asset_name }}" > "bin/${{ matrix.asset_name }}.sha256"
          fi
        shell: bash

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/${{ matrix.asset_name }}
            bin/${{ matrix.asset_name }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
